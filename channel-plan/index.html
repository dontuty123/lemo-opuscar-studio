<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kế hoạch kênh Footnote</title>
<meta name="description" content="Kế hoạch kênh lịch sử kể chuyện bằng motion, kèm hai báo cáo nghiên cứu về cách kể chuyện bằng hoạt hình.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Be+Vietnam+Pro:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: thanh chọn tài liệu dính trên cùng, một cột đọc 760px; cùng hệ màu đen, trắng, neon với Lemo-Opuscar Studio. */
:root{
  --ink:#050507; --panel:#0b0c10; --panel2:#111319; --line:#22252e; --line2:#2f333e;
  --fg:#f3f4f6; --soft:#c6c9d1; --mute:#8a8f9b; --neon:#3cf2ff; --neon2:#ff3ee8;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--fg);font:16px/1.7 var(--f-body);-webkit-font-smoothing:antialiased}
a{color:var(--neon)}
.bar{position:sticky;top:0;z-index:10;background:rgba(5,5,7,.85);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.bar .in{max-width:1100px;margin:0 auto;padding:12px 16px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.brand{font:600 13px var(--f-display);letter-spacing:.06em;color:var(--fg);text-decoration:none;display:flex;gap:10px;align-items:center}
.brand i{width:10px;height:10px;border-radius:50%;background:var(--neon);box-shadow:0 0 12px var(--neon)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tabs button{appearance:none;border:1px solid var(--line2);background:transparent;color:var(--soft);font:600 13px var(--f-body);padding:8px 13px;border-radius:999px;cursor:pointer}
.tabs button:hover{border-color:var(--soft);color:var(--fg)}
.tabs button[aria-selected="true"]{background:var(--neon);border-color:var(--neon);color:var(--ink)}
.tabs button:focus-visible{outline:2px solid var(--neon);outline-offset:2px}
main{max-width:800px;margin:0 auto;padding:40px 16px 80px}
.doc h1{font:800 clamp(28px,5vw,44px)/1.15 var(--f-display);letter-spacing:-.01em;margin:0 0 12px;text-wrap:balance}
.doc h2{font:600 clamp(20px,3vw,26px)/1.25 var(--f-display);margin:56px 0 14px;padding-top:20px;border-top:1px solid var(--line);text-wrap:balance}
.doc h3{font:600 18px/1.3 var(--f-body);margin:32px 0 10px;color:var(--neon)}
.doc p,.doc li{color:var(--soft)}
.doc strong{color:var(--fg)}
.doc ul,.doc ol{padding-left:22px}
.doc li{margin:6px 0}
.doc code{font:13px var(--f-mono);background:var(--panel2);border:1px solid var(--line2);padding:1px 6px;border-radius:6px;color:#e7fbff}
.doc pre{background:#000;border:1px solid var(--line2);border-radius:12px;padding:16px;overflow-x:auto}
.doc pre code{background:none;border:0;padding:0;font-size:13px;line-height:1.65}
.doc blockquote{margin:16px 0;padding:12px 16px;border-left:3px solid var(--neon);background:var(--panel);border-radius:0 10px 10px 0}
.doc .tw{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:12px}
.doc table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
.doc th,.doc td{padding:10px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.doc th{background:var(--panel2);color:var(--fg);font-weight:600}
.doc td{color:var(--soft)}
.doc tr:last-child td{border-bottom:0}
.doc img{max-width:100%;border-radius:12px;background:#fff;padding:8px}
.doc input[type=checkbox]{accent-color:var(--neon);margin-right:8px}
.loading,.err{color:var(--mute);font:14px var(--f-mono)}
footer{max-width:800px;margin:0 auto;padding:0 16px 48px;color:var(--mute);font-size:13px}
</style>
</head>
<body>
<header class="bar"><div class="in">
  <a class="brand" href="../"><i></i>LEMO-OPUSCAR STUDIO</a>
  <nav class="tabs" role="tablist" aria-label="Tài liệu">
    <button type="button" role="tab" data-doc="plan.md" aria-selected="true">Kế hoạch kênh</button>
    <button type="button" role="tab" data-doc="key-ke-chuyen-motion.md" aria-selected="false">Key kể chuyện bằng motion</button>
    <button type="button" role="tab" data-doc="bi-quyet-hoat-hinh.md" aria-selected="false">Bí quyết hoạt hình kể chuyện</button>
  </nav>
</div></header>
<main><article class="doc" id="doc"><p class="loading">Đang tải tài liệu…</p></article></main>
<footer>Bản đọc trên web của kế hoạch kênh và hai báo cáo nghiên cứu. Bản gốc có thể sửa và bình luận nằm trên Claude.</footer>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(function(){
  var docEl = document.getElementById('doc'), btns = [].slice.call(document.querySelectorAll('.tabs button'));
  function load(file){
    btns.forEach(function(b){ b.setAttribute('aria-selected', String(b.dataset.doc === file)); });
    docEl.innerHTML = '<p class="loading">Đang tải tài liệu…</p>';
    fetch(file).then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); }).then(function(md){
      docEl.innerHTML = marked.parse(md, { gfm: true });
      [].slice.call(docEl.querySelectorAll('table')).forEach(function(t){ var w = document.createElement('div'); w.className = 'tw'; t.parentNode.insertBefore(w, t); w.appendChild(t); });
      [].slice.call(docEl.querySelectorAll('a[href^="http"]')).forEach(function(a){ a.target = '_blank'; a.rel = 'noopener'; });
      var id = file.replace('.md', ''); if (location.hash.slice(1) !== id) history.replaceState(null, '', '#' + id);
      window.scrollTo(0, 0);
    }).catch(function(e){ docEl.innerHTML = '<p class="err">Không tải được tài liệu (' + e.message + '). Thử tải lại trang.</p>'; });
  }
  btns.forEach(function(b){ b.addEventListener('click', function(){ load(b.dataset.doc); }); });
  var start = btns.filter(function(b){ return '#' + b.dataset.doc.replace('.md','') === location.hash; })[0];
  load(start ? start.dataset.doc : 'plan.md');
  window.addEventListener('hashchange', function(){ var m = btns.filter(function(b){ return '#' + b.dataset.doc.replace('.md','') === location.hash; })[0]; if (m && m.getAttribute('aria-selected') !== 'true') load(m.dataset.doc); });
})();
</script>
</body>
</html>
